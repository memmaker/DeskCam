[package]
name = "deskcam"
version = "0.1.0"
edition = "2024"

[dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["block2"] }
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "block2"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
